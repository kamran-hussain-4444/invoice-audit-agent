[project]
name = "invoice-audit-agent"
version = "0.1.0"
description = "Extract invoice data with Claude and run audit main testing and cut-off testing against ledger listings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "extract-msg>=0.57.0",
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
audit = "invoice_audit.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "invoice_audit"   # project is "invoice-audit-agent" but the import name is shorter

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (costs money)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, UP = modern Python syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]
